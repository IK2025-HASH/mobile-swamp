name: Build APK

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Kivy APK (Docker/Buildozer)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Buildozer artifacts
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-docker-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-docker-${{ runner.os }}-

      - name: Build APK via kivy/buildozer Docker image
        run: |
          docker run --rm \
            -v "$(pwd)":/home/user/hostcwd \
            kivy/buildozer:latest \
            android debug 2>&1 | tee build.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk
          retention-days: 14

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14

      - name: Save build log to repo
        if: always()
        run: |
          mkdir -p logs
          cp build.log logs/build-$(date -u +%Y%m%dT%H%M%S)-${GITHUB_SHA::8}.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/
          git diff --cached --quiet || git commit -m "ci: save build log [skip ci]"
          git push
