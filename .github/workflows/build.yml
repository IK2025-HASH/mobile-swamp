name: Build APK

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Kivy APK (Buildozer)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev lld

      - name: Install Buildozer + Cython
        run: pip install --upgrade buildozer cython

      - name: Accept Android SDK licences and install build-tools
        run: |
          yes | sudo /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          sudo /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            "build-tools;34.0.0" "platforms;android-34"

      - name: Point Buildozer at the pre-installed SDK/NDK
        run: |
          # Use the runner's pre-installed SDK so Buildozer doesn't re-download it
          echo "ANDROIDSDK=/usr/local/lib/android/sdk"   >> $GITHUB_ENV
          echo "ANDROIDNDK=/usr/local/lib/android/sdk/ndk/27.3.13750724" >> $GITHUB_ENV
          echo "ANDROIDAPI=34"                           >> $GITHUB_ENV
          echo "ANDROIDMINAPI=24"                        >> $GITHUB_ENV

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Cache .buildozer (project)
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: dot-buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: dot-buildozer-${{ runner.os }}-

      - name: Build debug APK
        run: set -o pipefail; buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk
          retention-days: 14

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14

      - name: Save build log to repo
        if: always()
        run: |
          mkdir -p logs
          cp build.log logs/build-$(date -u +%Y%m%dT%H%M%S)-${GITHUB_SHA::8}.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/
          git diff --cached --quiet || git commit -m "ci: save build log [skip ci]"
          git push
