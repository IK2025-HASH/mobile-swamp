name: Build APK

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Kivy APK (Buildozer)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Buildozer artifacts
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Build APK with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          workdir: .
          buildozer-version: stable

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.buildozer.outputs.filename }}
          retention-days: 14

      - name: Copy and save build log
        if: always()
        run: |
          mkdir -p logs
          [ -f build.log ] && cp build.log logs/build-$(date -u +%Y%m%dT%H%M%S)-${GITHUB_SHA::8}.log || echo "no build.log" > logs/build-$(date -u +%Y%m%dT%H%M%S)-${GITHUB_SHA::8}.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/
          git diff --cached --quiet || git commit -m "ci: save build log [skip ci]"
          git push
